<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>📔 Chismógrafo Digital 📔</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📔 Chismógrafo Digital 📔</h1>

    <!-- Formulario para registrar chismes -->
    <form id="chismeForm">
      <input type="text" id="nombre" placeholder="👤 Nombre" required>
      <input type="number" id="edad" placeholder="🎂 Edad" required>
      <input type="text" id="colorFavorito" placeholder="🎨 Color Favorito" required>
      <input type="text" id="quienLeGusta" placeholder="💖 ¿Quién te gusta?" required>
    </form>

    <!-- Botones CRUD -->
    <div class="crud-buttons">
      <button type="button" id="btnCrear">➕ Crear</button>
      <button type="button" id="btnLeer">👁️ Leer</button>
      <button type="button" id="btnActualizar">✏️ Actualizar</button>
      
    </div>

    <!-- Botones de navegación -->
    <div class="nav-buttons">
      <a href="usuarios.html" class="btn-link">👥 Ver Usuarios</a>
      <a href="top.html" class="btn-link">💖 Ver Top Guapos</a>
    </div>

    <!-- Contenedor para mostrar resultados -->
    <div id="resultado"></div>
  </div>

  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
